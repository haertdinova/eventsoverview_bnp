<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Научные мероприятия · ФГН НИУ ВШЭ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="hero">
      <div>
        <h1>Научный обзор ФГН</h1>
        <p class="hero-sub">
          Мероприятия, гранты и возможности для сотрудников ФГН НИУ ВШЭ
        </p>
        <p class="hero-stats" id="hero-stats"></p>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="events">
        <span>📅 Мероприятия</span>
        <span class="tab-count" id="count-events">0</span>
      </button>
      <button class="tab-btn" data-tab="grants">
        <span>🏆 Гранты</span>
        <span class="tab-count" id="count-grants">0</span>
      </button>
      <button class="tab-btn" data-tab="extra">
        <span>🌟 Дополнительно</span>
        <span class="tab-count" id="count-extra">0</span>
      </button>
    </nav>

    <section id="tab-events" class="tab-content active">
      <button class="filters-toggle" id="filters-toggle">Фильтры</button>

      <div class="filters" id="filters-events">
        <div class="filter filter-search">
          <label for="filter-search">Поиск</label>
          <input type="search" id="filter-search" placeholder="Название, дата, организатор" />
        </div>
        <div class="filter">
          <label for="filter-organizer">Организатор</label>
          <select id="filter-organizer"><option value="">Все организаторы</option></select>
        </div>
        <div class="filter">
          <label for="filter-month">Месяц</label>
          <select id="filter-month"><option value="">Все месяцы</option></select>
        </div>
        <div class="filter">
          <label for="filter-type">Тип</label>
          <select id="filter-type"><option value="">Все типы</option></select>
        </div>
        <div class="filter">
          <label for="sort-by">Сортировка</label>
          <select id="sort-by">
            <option value="date-asc">Дата проведения ↑</option>
            <option value="date-desc">Дата проведения ↓</option>
            <option value="deadline-asc">Дедлайн: сначала срочные</option>
            <option value="deadline-desc">Дедлайн: сначала дальние</option>
            <option value="name-asc">Название А → Я</option>
            <option value="name-desc">Название Я → А</option>
          </select>
        </div>
        <button class="btn-ghost" id="clear-events">Сбросить</button>
      </div>

      <div class="results-bar">
        <span class="result-count" id="result-count"></span>
        <button class="btn-toggle" id="filter-new-only">Только новое</button>
      </div>

      <div class="cards-grid" id="events-container"></div>
    </section>

    <section id="tab-grants" class="tab-content">
      <div class="filters">
        <div class="filter filter-search">
          <label for="grant-search">Поиск</label>
          <input type="search" id="grant-search" placeholder="Название, дата, организатор" />
        </div>
      </div>
      <div class="cards-grid" id="grants-container"></div>
    </section>

    <section id="tab-extra" class="tab-content">
      <div class="filters">
        <div class="filter filter-search">
          <label for="extra-search">Поиск</label>
          <input type="search" id="extra-search" placeholder="Название, дата, организатор" />
        </div>
      </div>
      <div class="cards-grid" id="extra-container"></div>
    </section>

    <footer class="footer"><span id="status">Загрузка данных…</span></footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
