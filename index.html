<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Научные мероприятия · ФГН НИУ ВШЭ</title>

  <!-- Резервный шрифт, если HSE Sans не загрузится -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="hero">
      <div>
        <h1>Научные мероприятия</h1>
        <p class="hero-sub">
          Конференции, гранты и возможности для сотрудников ФГН НИУ ВШЭ · 2026–2027
        </p>
      </div>
      <a class="sheet-link" id="sheet-link" target="_blank" rel="noopener">
        ✎ Редактировать таблицу
      </a>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="events">
        <span>📅 Мероприятия</span>
        <span class="tab-count" id="count-events">0</span>
      </button>
      <button class="tab-btn" data-tab="grants">
        <span>💰 Гранты</span>
        <span class="tab-count" id="count-grants">0</span>
      </button>
      <button class="tab-btn" data-tab="extra">
        <span>🌟 Дополнительно</span>
        <span class="tab-count" id="count-extra">0</span>
      </button>
    </nav>

    <!-- Вкладка: Мероприятия -->
    <section id="tab-events" class="tab-content active">
      <div class="filters">
        <div class="filter">
          <label for="filter-type">Тип</label>
          <select id="filter-type"><option value="">Все типы</option></select>
        </div>
        <div class="filter">
          <label for="filter-month">Месяц</label>
          <select id="filter-month"><option value="">Все месяцы</option></select>
        </div>
        <div class="filter filter-search">
          <label for="filter-search">Поиск</label>
          <input type="search" id="filter-search" placeholder="Название, организатор, дата…" />
        </div>
        <button class="btn-ghost" id="clear-events">Сбросить</button>
        <button class="btn-sort" id="sort-date">Дата ↑</button>
      </div>
      <div class="cards-grid" id="events-container"></div>
    </section>

    <!-- Вкладка: Гранты -->
    <section id="tab-grants" class="tab-content">
      <div class="list-toolbar">
        <input type="search" id="grant-search" placeholder="Поиск по грантам…" />
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Наименование</th><th>Дедлайн</th><th>Организатор</th></tr>
          </thead>
          <tbody id="grants-body"></tbody>
        </table>
      </div>
    </section>

    <!-- Вкладка: Дополнительно -->
    <section id="tab-extra" class="tab-content">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Наименование</th><th>Дедлайн</th><th>Организатор</th></tr>
          </thead>
          <tbody id="extra-body"></tbody>
        </table>
      </div>
    </section>

    <footer class="footer"><span id="status">Загрузка данных…</span></footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
